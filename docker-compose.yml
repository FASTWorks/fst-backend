
services:
  fst-gateway-service:
    build:
      context: ./fst-gateway-service
    ports:
      - "3000:3000"
    env_file:
      - ./fst-gateway-service/.env.docker
    networks:
      - fast-network
    depends_on:
      - fst-auth-service
      - fst-finance-service
      - fst-analytics-service
      - fst-aggregator-service

  fst-auth-service:
    build:
      context: ./fst-auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./fst-auth-service/.env.docker
    networks:
      - fast-network
    depends_on:
      - postgres-db

  fst-aggregator-service:
    build:
      context: ./fst-aggregator-service
    ports:
      - "3002:3002"
    env_file:
      - ./fst-aggregator-service/.env.docker
    networks:
      - fast-network

  fst-finance-service:
    build:
      context: ./fst-finance-service
    ports:
      - "3003:3003"
    env_file:
      - ./fst-finance-service/.env.docker
    networks:
      - fast-network
    depends_on:
      - fst-ai-service
      - postgres-db

  fst-analytics-service:
    build:
      context: ./fst-analytics-service
    ports:
      - "3004:3004"
    env_file:
      - ./fst-analytics-service/.env.docker
    networks:
      - fast-network
    depends_on:
      - fst-ai-service
      - postgres-db

  fst-ai-service:
    build:
      context: ./fst-ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./fst-ai-service/.env.docker
    networks:
      - fast-network

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sasa1234
    ports:
      - "5433:5432"
    networks:
      - fast-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql

networks:
  fast-network:
    driver: bridge

volumes:
  postgres-data:
